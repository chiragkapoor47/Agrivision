services:
  - type: web
    name: crop-disease-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: crop-disease-db
          property: connectionString

databases:
  - name: crop-disease-db
    plan: free
    databaseName: crop_disease_db
    user: crop_user
